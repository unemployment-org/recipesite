{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RecipeShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="{% url 'home' %}" class="logo">🍳 RecipeShare</a>

            <form action="{% url 'home' %}" method="get" class="search-form">
                <div class="search-bar">
                    <input type="text" name="search" placeholder="Search recipes..." value="{{ search_query|default:'' }}">
                    <button type="submit">🔍</button>
                </div>
            </form>

            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="user-btn">👤 {{ user.username }}</a>
                    <a href="{% url 'recipe_create' %}" class="nav-item">New Recipe</a>
                    <form action="{% url 'logout' %}" method="post" style="margin:0; padding:0; display: flex;">
                        {% csrf_token %}
                        <button type="submit" class="nav-item logout-btn">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-item">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container content">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 RecipeShare Team</p>
    </footer>

</body>
</html>
